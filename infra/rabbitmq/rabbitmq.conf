# A topologia (exchange, filas, retry, DLQ) é criada quando o RabbitMQ sobe, a partir
# de definitions.json. Assim nenhuma mensagem se perde se um produtor subir antes do
# consumidor. Os consumidores também declaram a própria fila (o que não muda nada se
# ela já existe), para poderem rodar sozinhos em desenvolvimento.
definitions.import_backend = local_filesystem
definitions.local.path = /etc/rabbitmq/definitions.json
