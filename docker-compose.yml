# Ambiente completo: aplicação de integração + i-Educar (submodule) + Moodle.
#
# O i-Educar é incluído a partir do compose do próprio submodule, então os
# serviços dele (nginx, fpm, php, horizon, postgres, redis) continuam sendo
# configurados por i-educar/docker-compose.yml e i-educar/.env. Os ajustes
# necessários para a integração ficam em ieducar.override.yml.

include:
  - path:
      - i-educar/docker-compose.yml
      - ieducar.override.yml
    env_file: i-educar/.env

services:

  integration:
    container_name: integration-app
    build: .
    ports:
      - ${API_PORT:-8000}:8000
    environment:
      IEDUCAR_URL: http://nginx
      # Deve ser igual a "Chave de acesso" em Configurações > Configurações do sistema
      # do i-Educar (tabela settings, chave legacy.apis.access_key).
      IEDUCAR_ACCESS_KEY: ${IEDUCAR_ACCESS_KEY:-ieducar-access-key}
      IEDUCAR_INSTITUICAO_ID: ${IEDUCAR_INSTITUICAO_ID:-1}
      IEDUCAR_ESCOLA_ID: ${IEDUCAR_ESCOLA_ID:-}
      IEDUCAR_ANO_LETIVO: ${IEDUCAR_ANO_LETIVO:-}
      MOODLE_URL: http://moodle:8080
      MOODLE_SETUP_FILE: /shared/moodle.json
      DATABASE_PATH: /data/integration.db
      SYNC_INTERVAL_SECONDS: ${SYNC_INTERVAL_SECONDS:-300}
      MOODLE_TOKEN: ${MOODLE_TOKEN:-}
    volumes:
      - integration_data:/data
      - integration_shared:/shared:ro
    depends_on:
      nginx:
        condition: service_started
      moodle-setup:
        condition: service_completed_successfully
    restart: unless-stopped
    develop:
      watch:
        - action: sync+restart
          path: ./src
          target: /app/src
        - action: rebuild
          path: ./uv.lock

  moodle-mariadb:
    container_name: moodle-mariadb
    image: bitnamilegacy/mariadb:11.8.3
    environment:
      MARIADB_USER: ${MOODLE_DATABASE_USER:-bn_moodle}
      MARIADB_PASSWORD: ${MOODLE_DATABASE_PASSWORD:-moodle}
      MARIADB_DATABASE: ${MOODLE_DATABASE_NAME:-bitnami_moodle}
      MARIADB_ROOT_PASSWORD: ${MOODLE_DATABASE_ROOT_PASSWORD:-root}
      MARIADB_CHARACTER_SET: utf8mb4
      MARIADB_COLLATE: utf8mb4_unicode_ci
    volumes:
      - moodle_mariadb:/bitnami/mariadb
    healthcheck:
      test: ["CMD", "/opt/bitnami/scripts/mariadb/healthcheck.sh"]
      interval: 15s
      timeout: 5s
      retries: 6

  moodle:
    container_name: moodle
    image: bitnamilegacy/moodle:5.0.2
    ports:
      - ${MOODLE_HTTP_PORT:-8080}:8080
      - ${MOODLE_HTTPS_PORT:-8443}:8443
    environment:
      MOODLE_DATABASE_TYPE: mariadb
      MOODLE_DATABASE_HOST: moodle-mariadb
      MOODLE_DATABASE_PORT_NUMBER: 3306
      MOODLE_DATABASE_USER: ${MOODLE_DATABASE_USER:-bn_moodle}
      MOODLE_DATABASE_PASSWORD: ${MOODLE_DATABASE_PASSWORD:-moodle}
      MOODLE_DATABASE_NAME: ${MOODLE_DATABASE_NAME:-bitnami_moodle}
      MOODLE_USERNAME: ${MOODLE_USERNAME:-admin}
      MOODLE_PASSWORD: ${MOODLE_PASSWORD:-admin123}
      MOODLE_EMAIL: ${MOODLE_EMAIL:-admin@example.com}
      MOODLE_SITE_NAME: ${MOODLE_SITE_NAME:-Moodle}
    volumes:
      - moodle_data:/bitnami/moodle
      - moodledata_data:/bitnami/moodledata
    depends_on:
      moodle-mariadb:
        condition: service_healthy
    healthcheck:
      # A primeira inicialização instala o Moodle e pode levar vários minutos.
      test: ["CMD", "/opt/bitnami/php/bin/php", "-r", "exit(@file_get_contents('http://localhost:8080/login/index.php') === false ? 1 : 0);"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 10m

  # Executa uma vez a cada `up`: habilita os Web Services REST do Moodle, cria o
  # serviço e o token da integração e grava o resultado em /shared/moodle.json.
  moodle-setup:
    container_name: moodle-setup
    image: bitnamilegacy/moodle:5.0.2
    entrypoint: ["/bin/sh", "-c"]
    # O PHP roda como o usuário do Apache (daemon) para não criar arquivos de
    # cache como root no moodledata; a gravação em /shared é feita pelo root.
    command:
      - >-
        su -s /bin/sh daemon -c '/opt/bitnami/php/bin/php /setup/setup_webservice.php'
        > /shared/moodle.json.tmp && mv /shared/moodle.json.tmp /shared/moodle.json
    volumes:
      - moodle_data:/bitnami/moodle
      - moodledata_data:/bitnami/moodledata
      - ./moodle:/setup:ro
      - integration_shared:/shared
    depends_on:
      moodle:
        condition: service_healthy
    restart: "no"

volumes:
  moodle_mariadb:
  moodle_data:
  moodledata_data:
  integration_data:
  integration_shared:
