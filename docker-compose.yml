# Ambiente completo do T2: os três serviços de integração (submodules em servicos/,
# cada um com repositório, versão e imagem próprios) + RabbitMQ + i-Educar
# (submodule) + Moodle.
#
# O i-Educar é incluído a partir do compose do próprio submodule, então os
# serviços dele (nginx, fpm, php, horizon, postgres, redis) continuam sendo
# configurados por i-educar/docker-compose.yml e i-educar/.env. Os ajustes
# necessários para a integração ficam em ieducar.override.yml.

include:
  - path:
      - i-educar/docker-compose.yml
      - ieducar.override.yml
    env_file: i-educar/.env

services:

  # --- Integração: três serviços (cada um no seu repositório) e o broker ----
  #
  #   i-Educar ──▶ detector ──eventos──▶ sincronizador ──comandos──▶ publicador ──▶ Moodle
  #                            (RabbitMQ)                 (RabbitMQ)

  rabbitmq:
    container_name: rabbitmq
    image: rabbitmq:4.1.4-management
    hostname: rabbitmq
    ports:
      - ${RABBITMQ_UI_PORT:-15672}:15672
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
      - ./infra/rabbitmq/rabbitmq.conf:/etc/rabbitmq/conf.d/20-integracao.conf:ro
      - ./infra/rabbitmq/definitions.json:/etc/rabbitmq/definitions.json:ro
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 10

  detector:
    container_name: detector
    # Repositório próprio (submodule em servicos/detector). Para usar uma versão publicada
    # em vez de construir: DETECTOR_IMAGEM=ghcr.io/<dono>/ieducar-moodle-detector:v1.0.0
    image: ${DETECTOR_IMAGEM:-ieducar-moodle-detector:local}
    build: ./servicos/detector
    environment:
      RABBITMQ_URL: amqp://integracao:integracao@rabbitmq:5672/
      DATABASE_PATH: /data/detector.db
      IEDUCAR_URL: http://nginx
      # Deve ser igual a "Chave de acesso" em Configurações > Configurações do sistema
      # do i-Educar (tabela settings, chave legacy.apis.access_key).
      IEDUCAR_ACCESS_KEY: ${IEDUCAR_ACCESS_KEY:-ieducar-access-key}
      IEDUCAR_INSTITUICAO_ID: ${IEDUCAR_INSTITUICAO_ID:-1}
      IEDUCAR_ESCOLA_ID: ${IEDUCAR_ESCOLA_ID:-}
      IEDUCAR_ANO_LETIVO: ${IEDUCAR_ANO_LETIVO:-}
      INTERVALO_SEGUNDOS: ${DETECTOR_INTERVALO:-60}
    ports:
      - ${DETECTOR_PORT:-8001}:8000
    volumes:
      - detector_data:/data
    depends_on:
      rabbitmq:
        condition: service_healthy
      nginx:
        condition: service_started
    restart: unless-stopped

  sincronizador:
    container_name: sincronizador
    # Repositório próprio (submodule em servicos/sincronizador). Para usar uma versão publicada
    # em vez de construir: SINCRONIZADOR_IMAGEM=ghcr.io/<dono>/ieducar-moodle-sincronizador:v1.0.0
    image: ${SINCRONIZADOR_IMAGEM:-ieducar-moodle-sincronizador:local}
    build: ./servicos/sincronizador
    environment:
      RABBITMQ_URL: amqp://integracao:integracao@rabbitmq:5672/
      DATABASE_PATH: /data/sincronizador.db
      # MODO DEMONSTRAÇÃO: retry a cada 3s (padrão dos serviços: 10s), para os cenários
      # de falha caberem na apresentação. Depois de RETRY_TENTATIVAS falhas, DLQ.
      RETRY_ATRASO: ${RETRY_ATRASO:-3}
      RETRY_TENTATIVAS: ${RETRY_TENTATIVAS:-5}
    ports:
      - ${SINCRONIZADOR_PORT:-8002}:8000
    volumes:
      - sincronizador_data:/data
    depends_on:
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  publicador:
    container_name: publicador
    # Repositório próprio (submodule em servicos/publicador). Para usar uma versão publicada
    # em vez de construir: PUBLICADOR_IMAGEM=ghcr.io/<dono>/ieducar-moodle-publicador:v1.0.0
    image: ${PUBLICADOR_IMAGEM:-ieducar-moodle-publicador:local}
    build: ./servicos/publicador
    environment:
      RABBITMQ_URL: amqp://integracao:integracao@rabbitmq:5672/
      DATABASE_PATH: /data/publicador.db
      # MODO DEMONSTRAÇÃO: retry a cada 3s (padrão dos serviços: 10s), para os cenários
      # de falha caberem na apresentação. Depois de RETRY_TENTATIVAS falhas, DLQ.
      RETRY_ATRASO: ${RETRY_ATRASO:-3}
      RETRY_TENTATIVAS: ${RETRY_TENTATIVAS:-5}
      MOODLE_URL: http://moodle:8080
      MOODLE_SETUP_FILE: /shared/moodle.json
      MOODLE_TIMEOUT: ${MOODLE_TIMEOUT:-10}
    ports:
      - ${PUBLICADOR_PORT:-8003}:8000
    volumes:
      - publicador_data:/data
      - integration_shared:/shared:ro
    depends_on:
      rabbitmq:
        condition: service_healthy
      moodle-setup:
        condition: service_completed_successfully
    restart: unless-stopped

  # --- Moodle ----------------------------------------------------------------

  moodle-mariadb:
    container_name: moodle-mariadb
    image: bitnamilegacy/mariadb:11.8.3
    environment:
      MARIADB_USER: ${MOODLE_DATABASE_USER:-bn_moodle}
      MARIADB_PASSWORD: ${MOODLE_DATABASE_PASSWORD:-moodle}
      MARIADB_DATABASE: ${MOODLE_DATABASE_NAME:-bitnami_moodle}
      MARIADB_ROOT_PASSWORD: ${MOODLE_DATABASE_ROOT_PASSWORD:-root}
      MARIADB_CHARACTER_SET: utf8mb4
      MARIADB_COLLATE: utf8mb4_unicode_ci
    volumes:
      - moodle_mariadb:/bitnami/mariadb
    healthcheck:
      test: ["CMD", "/opt/bitnami/scripts/mariadb/healthcheck.sh"]
      interval: 15s
      timeout: 5s
      retries: 6

  moodle:
    container_name: moodle
    image: bitnamilegacy/moodle:5.0.2
    ports:
      - ${MOODLE_HTTP_PORT:-8080}:8080
      - ${MOODLE_HTTPS_PORT:-8443}:8443
    environment:
      MOODLE_DATABASE_TYPE: mariadb
      MOODLE_DATABASE_HOST: moodle-mariadb
      MOODLE_DATABASE_PORT_NUMBER: 3306
      MOODLE_DATABASE_USER: ${MOODLE_DATABASE_USER:-bn_moodle}
      MOODLE_DATABASE_PASSWORD: ${MOODLE_DATABASE_PASSWORD:-moodle}
      MOODLE_DATABASE_NAME: ${MOODLE_DATABASE_NAME:-bitnami_moodle}
      MOODLE_USERNAME: ${MOODLE_USERNAME:-admin}
      MOODLE_PASSWORD: ${MOODLE_PASSWORD:-admin123}
      MOODLE_EMAIL: ${MOODLE_EMAIL:-admin@example.com}
      MOODLE_SITE_NAME: ${MOODLE_SITE_NAME:-Moodle}
    volumes:
      - moodle_data:/bitnami/moodle
      - moodledata_data:/bitnami/moodledata
    depends_on:
      moodle-mariadb:
        condition: service_healthy
    healthcheck:
      # A primeira inicialização instala o Moodle e pode levar vários minutos.
      test: ["CMD", "/opt/bitnami/php/bin/php", "-r", "exit(@file_get_contents('http://localhost:8080/login/index.php') === false ? 1 : 0);"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 10m

  # Executa uma vez a cada `up`: habilita os Web Services REST do Moodle, cria o
  # serviço e o token da integração e grava o resultado em /shared/moodle.json.
  moodle-setup:
    container_name: moodle-setup
    image: bitnamilegacy/moodle:5.0.2
    entrypoint: ["/bin/sh", "-c"]
    # O PHP roda como o usuário do Apache (daemon) para não criar arquivos de
    # cache como root no moodledata; a gravação em /shared é feita pelo root.
    command:
      - >-
        su -s /bin/sh daemon -c '/opt/bitnami/php/bin/php /setup/setup_webservice.php'
        > /shared/moodle.json.tmp && mv /shared/moodle.json.tmp /shared/moodle.json
    volumes:
      - moodle_data:/bitnami/moodle
      - moodledata_data:/bitnami/moodledata
      - ./moodle:/setup:ro
      - integration_shared:/shared
    depends_on:
      moodle:
        condition: service_healthy
    restart: "no"

volumes:
  rabbitmq_data:
  detector_data:
  sincronizador_data:
  publicador_data:
  moodle_mariadb:
  moodle_data:
  moodledata_data:
  integration_shared:
